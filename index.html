<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あみだくじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one column — settings strip, ladder board (names / ladder canvas / results), result list */
:root{
  --bg:#f3f1ec; --panel:#fffdf8; --fg:#23262e; --muted:#6b6f7a; --line:#2c3a5a;
  --accent:#2f4fa8; --accent-fg:#ffffff; --hit:#c8891a; --hit-bg:#fbefd6; --miss-bg:#ebeae6;
  --border:#dcd8cf; --cover:#d9d4c8;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a21; --panel:#20242d; --fg:#eceef2; --muted:#9aa0ad; --line:#aab8dc;
  --accent:#7d9bf0; --accent-fg:#10131a; --hit:#f0b84a; --hit-bg:#3a2f18; --miss-bg:#2a2e37;
  --border:#343946; --cover:#3a3f4b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171a21; --panel:#20242d; --fg:#eceef2; --muted:#9aa0ad; --line:#aab8dc;
  --accent:#7d9bf0; --accent-fg:#10131a; --hit:#f0b84a; --hit-bg:#3a2f18; --miss-bg:#2a2e37;
  --border:#343946; --cover:#3a3f4b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0;letter-spacing:.04em}
.tally{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--hit);font-size:18px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸";transition:transform .2s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.form .wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
.hint{font-size:12px;font-weight:500;color:var(--muted)}
.err{color:#c0392b;font-size:13px;font-weight:700;min-height:1em}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--fg);padding:8px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.board{padding:14px 8px}
.row{display:grid;gap:0}
.name{writing-mode:vertical-rl;text-orientation:upright;margin:0 auto;padding:8px 4px;min-height:96px;max-height:150px;border-radius:10px;border:2px solid var(--border);background:var(--bg);font-weight:700;font-size:14px;letter-spacing:.08em;overflow:hidden;line-height:1.2}
.name.done{color:#fff;border-color:transparent}
.canvas-box{position:relative;height:clamp(300px,52vh,460px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot{margin:0 auto;width:min(40px,92%);min-height:96px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 2px;gap:6px;background:var(--miss-bg);border:2px solid transparent;font-weight:700}
.slot .lbl{writing-mode:vertical-rl;text-orientation:upright;font-size:14px;letter-spacing:.1em}
.slot .who{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;color:var(--muted);letter-spacing:.05em}
.slot.hit{background:var(--hit-bg);border-color:var(--hit);color:var(--hit)}
.slot.covered{background:var(--cover);color:var(--muted)}
.slot.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:var(--bg);border-left:6px solid var(--c)}
.res span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:900;padding:2px 10px;border-radius:999px;background:var(--miss-bg);color:var(--muted);flex:none}
.chip.hit{background:var(--hit);color:#fff}
h2{font-size:16px;margin:0}
.empty{color:var(--muted);font-size:13px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.person{flex-direction:row;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}
.person input{width:auto;margin:0;accent-color:var(--accent)}
.person small{color:var(--muted);font-weight:500;margin-left:auto}
.person.off{opacity:.5}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 140px;width:auto}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.slot.pop{animation:none}}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>あみだくじ</h1>
    <div class="tally" id="tally"></div>
  </header>

  <details class="panel" id="settingsBox">
    <summary>設定（対象者・あたり本数・表示）</summary>
    <form id="form" class="form" novalidate>
      <label>あたりの本数<input id="inW" type="number" min="0" max="20" inputmode="numeric"></label>
      <label>あたりの表示<input id="inHit" type="text" maxlength="6"></label>
      <label>はずれの表示<input id="inMiss" type="text" maxlength="6"></label>
      <div class="wide" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <strong>対象者 <span id="cnt" class="hint"></span></strong>
          <div class="bar"><button type="button" id="allOn">全員</button><button type="button" id="allOff">全解除</button>
          <button type="button" id="btnXlsx">Excelから読み込む</button><input type="file" id="fileX" accept=".xlsx,.xls,.csv" hidden></div>
        </div>
        <div class="roster" id="roster"></div>
        <div class="addrow"><input id="addName" placeholder="名前を追加"><input id="addStore" placeholder="店舗（任意）"><button type="button" id="btnAdd">追加</button></div>
        <span class="hint">チェックした人がくじの対象になります（2〜20人）。Excelは「名前」「店舗」列を読み込みます。</span>
      </div>
      <div class="wide err" id="err"></div>
      <div class="wide bar"><button type="submit" class="primary">この設定で作る</button></div>
    </form>
  </details>

  <div class="bar">
    <button class="primary" id="btnAll">全員スタート</button>
    <button id="btnNew">くじを作り直す</button>
    <button id="btnReveal">結果を先に見る</button>
    <button id="btnCopy">結果をコピー</button>
  </div>

  <section class="panel board" aria-label="あみだくじ">
    <div class="row" id="names"></div>
    <div class="canvas-box"><canvas id="cv"></canvas></div>
    <div class="row" id="slots"></div>
    <p class="note" style="text-align:center;margin:10px 0 0">名前をタップすると線をたどります</p>
  </section>

  <section class="panel">
    <h2>結果</h2>
    <div class="results" id="results"></div>
  </section>
</div>

<script>
(() => {
  const KEY = "amida-settings-v2";
  const ROSTER = [["高井 路子","駅西"],["辻 茉希","駅西"],["茂木 日和","神宮寺"],["中嶋 美江子","小立野"],["伊藤 由乃","松任"],["南山 香","松任"],["佐伯 直美","立山"],["大和田 理楠","額"],["桑山 直樹","泉野"],["川口 智正","神宮寺"]]
    .map(([name, store], i) => ({ name, store, on: i < 9 }));
  const DEF = { w: 7, hit: "あたり", miss: "はずれ", roster: ROSTER };
  let S = load();
  let L = null;            // ladder
  let outcome = [];        // per bottom column: true = hit
  let landed = [];         // bottom col -> start col
  let finished = {};       // start col -> bottom col
  let anims = [];          // active animations
  let revealAll = false;

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");

  function load(){
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
    s = Object.assign({}, DEF, s && Array.isArray(s.roster) ? s : {});
    return derive(s);
  }
  function derive(s){
    const act = s.roster.filter(p => p.on);
    s.n = act.length; s.names = act.map(p => p.name); s.stores = act.map(p => p.store || "");
    if (s.w > s.n) s.w = s.n;
    return s;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

  function names(){
    const out = [];
    for (let i = 0; i < S.n; i++) out.push((S.names[i] || "").trim() || "No." + (i + 1));
    return out;
  }
  function hue(i){ return Math.round((i * 360 / S.n + 205) % 360); }
  function color(i){ return `hsl(${hue(i)} 62% 48%)`; }
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function build(){
    const n = S.n, rows = Math.max(10, n + 4);
    const bars = [];
    for (let r = 0; r < rows; r++){
      const row = new Array(n - 1).fill(false);
      for (let c = 0; c < n - 1; c++){
        if (c > 0 && row[c - 1]) continue;
        if (Math.random() < 0.42) row[c] = true;
      }
      bars.push(row);
    }
    // every gap gets at least one bar
    for (let c = 0; c < n - 1; c++){
      if (bars.some(r => r[c])) continue;
      const ok = [];
      for (let r = 0; r < rows; r++) if (!(c > 0 && bars[r][c - 1]) && !(c < n - 2 && bars[r][c + 1])) ok.push(r);
      const r = ok.length ? ok[Math.floor(Math.random() * ok.length)] : 0;
      bars[r][c] = true; if (c > 0) bars[r][c - 1] = false; if (c < n - 2) bars[r][c + 1] = false;
    }
    const jit = bars.map(row => row.map(() => (Math.random() - 0.5) * 0.6));
    L = { rows, bars, jit };
    outcome = shuffle(Array.from({ length: n }, (_, i) => i < S.w));
    landed = new Array(n).fill(-1);
    finished = {}; anims = []; revealAll = false;
    renderRows(); renderResults(); draw();
  }

  // path in normalized units: x = column index, y = 0..1
  function trace(start){
    let c = start; const pts = [[c, 0]];
    for (let r = 0; r < L.rows; r++){
      let nc = c;
      if (c < S.n - 1 && L.bars[r][c]) nc = c + 1;
      else if (c > 0 && L.bars[r][c - 1]) nc = c - 1;
      if (nc !== c){
        const y = (r + 0.5 + L.jit[r][Math.min(c, nc)]) / L.rows;
        pts.push([c, y], [nc, y]); c = nc;
      }
    }
    pts.push([c, 1]);
    return { pts, end: c };
  }

  let geom = { w: 0, h: 0 };
  function px(p){ const pad = 6; return [ (p[0] + 0.5) * geom.w / S.n, pad + p[1] * (geom.h - pad * 2) ]; }

  function resize(){
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    geom = { w: r.width, h: r.height };
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    draw();
  }

  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function polyline(pts, len){
    ctx.beginPath();
    let p0 = px(pts[0]); ctx.moveTo(p0[0], p0[1]);
    let left = len;
    for (let i = 1; i < pts.length; i++){
      const p1 = px(pts[i]); const seg = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      if (left !== undefined && left < seg){
        const t = left / seg; ctx.lineTo(p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t);
        ctx.stroke(); return false;
      }
      ctx.lineTo(p1[0], p1[1]);
      if (left !== undefined) left -= seg;
      p0 = p1;
    }
    ctx.stroke(); return true;
  }

  function draw(){
    if (!L || !geom.w) return;
    ctx.clearRect(0, 0, geom.w, geom.h);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 3;
    for (let c = 0; c < S.n; c++){ const a = px([c, 0]), b = px([c, 1]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    for (let r = 0; r < L.rows; r++) for (let c = 0; c < S.n - 1; c++) if (L.bars[r][c]){
      const y = (r + 0.5 + L.jit[r][c]) / L.rows; const a = px([c, y]), b = px([c + 1, y]);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.lineWidth = 6;
    for (const k in finished){ ctx.strokeStyle = color(+k); polyline(trace(+k).pts); }
    for (const a of anims){ ctx.strokeStyle = color(a.start); a.done = polyline(a.pts, a.len); }
  }

  let last = 0, running = false;
  function tick(t){
    const dt = last ? Math.min(50, t - last) : 16; last = t;
    const speed = matchMedia("(prefers-reduced-motion: reduce)").matches ? 99999 : geom.h / 1400;
    anims.forEach(a => { if (t >= a.at) a.len += speed * dt; });
    draw();
    anims.filter(a => a.done).forEach(a => land(a.start, a.end));
    anims = anims.filter(a => !a.done);
    if (anims.length) requestAnimationFrame(tick); else { running = false; last = 0; draw(); }
  }
  function go(start, delay = 0){
    if (finished[start] !== undefined || anims.some(a => a.start === start)) return;
    const { pts, end } = trace(start);
    anims.push({ start, end, pts, len: 0, at: performance.now() + delay, done: false });
    const b = $("names").children[start]; b.classList.add("done"); b.style.background = color(start);
    if (!running){ running = true; requestAnimationFrame(tick); }
  }
  function land(start, end){
    finished[start] = end; landed[end] = start;
    renderSlot(end, true); renderResults();
  }

  function renderRows(){
    const nm = names(), cols = `repeat(${S.n}, minmax(0,1fr))`;
    const top = $("names"), bot = $("slots");
    top.style.gridTemplateColumns = cols; bot.style.gridTemplateColumns = cols;
    top.innerHTML = ""; bot.innerHTML = "";
    nm.forEach((name, i) => {
      const b = document.createElement("button");
      b.className = "name"; b.type = "button"; b.textContent = name; b.title = name + (S.stores[i] ? "（" + S.stores[i] + "）" : "");
      b.style.borderColor = color(i);
      b.addEventListener("click", () => go(i));
      top.appendChild(b);
      const s = document.createElement("div"); s.className = "slot"; bot.appendChild(s);
    });
    for (let i = 0; i < S.n; i++) renderSlot(i, false);
    const hits = outcome.filter(Boolean).length;
    $("tally").innerHTML = `${S.n}人中 <b>${hits}</b> 本${esc(S.hit)}`;
  }
  function renderSlot(i, pop){
    const s = $("slots").children[i]; if (!s) return;
    const who = landed[i];
    const open = revealAll || who >= 0;
    s.className = "slot" + (open ? (outcome[i] ? " hit" : "") : " covered") + (pop ? " pop" : "");
    s.innerHTML = `<span class="lbl">${open ? esc(outcome[i] ? S.hit : S.miss) : "？"}</span>` +
      (who >= 0 ? `<span class="who">${esc(names()[who])}</span>` : "");
    if (who >= 0) s.style.borderColor = color(who); else s.style.borderColor = "";
  }
  function renderResults(){
    const nm = names(), box = $("results"); box.innerHTML = "";
    const keys = Object.keys(finished).map(Number).sort((a, b) => a - b);
    if (!keys.length){ box.innerHTML = '<div class="empty">まだ誰も引いていません。名前をタップするか「全員スタート」を押してください。</div>'; return; }
    keys.forEach(k => {
      const hit = outcome[finished[k]];
      const d = document.createElement("div"); d.className = "res"; d.style.setProperty("--c", color(k));
      d.innerHTML = `<span>${esc(nm[k])}${S.stores[k] ? `<small style="color:var(--muted);margin-left:6px">${esc(S.stores[k])}</small>` : ""}</span><span class="chip${hit ? " hit" : ""}">${esc(hit ? S.hit : S.miss)}</span>`;
      box.appendChild(d);
    });
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  // controls
  $("btnAll").addEventListener("click", () => { let d = 0; for (let i = 0; i < S.n; i++) if (finished[i] === undefined){ go(i, d); d += 350; } });
  $("btnNew").addEventListener("click", build);
  $("btnReveal").addEventListener("click", () => {
    revealAll = !revealAll; $("btnReveal").textContent = revealAll ? "結果を隠す" : "結果を先に見る";
    for (let i = 0; i < S.n; i++) renderSlot(i, false);
  });
  $("btnCopy").addEventListener("click", async () => {
    const nm = names(); const lines = [];
    for (let i = 0; i < S.n; i++){ const e = finished[i]; lines.push(`${nm[i]}：${e === undefined ? "未" : (outcome[e] ? S.hit : S.miss)}`); }
    const txt = lines.join("\n"); const b = $("btnCopy");
    try { await navigator.clipboard.writeText(txt); b.textContent = "コピーしました"; }
    catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); b.textContent = "コピーしました"; } catch(_){} ta.remove(); }
    setTimeout(() => b.textContent = "結果をコピー", 1500);
  });

  let R = S.roster.map(p => Object.assign({}, p));   // roster being edited
  function fillForm(){
    $("inW").value = S.w; $("inHit").value = S.hit; $("inMiss").value = S.miss;
    R = S.roster.map(p => Object.assign({}, p)); drawRoster();
  }
  function drawRoster(){
    const box = $("roster"); box.innerHTML = "";
    R.forEach((p, i) => {
      const l = document.createElement("label"); l.className = "person" + (p.on ? "" : " off");
      l.innerHTML = `<input type="checkbox" id="p${i}" ${p.on ? "checked" : ""}><span>${esc(p.name)}</span><small>${esc(p.store || "")}</small>`;
      l.querySelector("input").addEventListener("change", e => { p.on = e.target.checked; drawRoster(); });
      box.appendChild(l);
    });
    $("cnt").textContent = `${R.filter(p => p.on).length}人選択中 / ${R.length}人`;
  }
  $("allOn").addEventListener("click", () => { R.forEach(p => p.on = true); drawRoster(); });
  $("allOff").addEventListener("click", () => { R.forEach(p => p.on = false); drawRoster(); });
  $("btnAdd").addEventListener("click", () => {
    const name = $("addName").value.trim(); if (!name) return;
    R.push({ name, store: $("addStore").value.trim(), on: true });
    $("addName").value = ""; $("addStore").value = ""; drawRoster();
  });
  $("btnXlsx").addEventListener("click", () => $("fileX").click());
  $("fileX").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer());
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
      const head = rows[0].map(v => String(v).trim());
      let ni = head.findIndex(h => /名前|氏名/.test(h)), si = head.findIndex(h => /店舗|所属/.test(h));
      const body = ni >= 0 ? rows.slice(1) : rows; if (ni < 0) ni = 0;
      const list = body.map(r => ({ name: String(r[ni] || "").trim(), store: si >= 0 ? String(r[si] || "").trim() : "", on: true })).filter(p => p.name);
      if (!list.length) throw 0;
      R = list; drawRoster(); $("err").textContent = `${list.length}人を読み込みました。チェックを確認して「この設定で作る」を押してください。`;
    } catch(_){ $("err").textContent = "読み込めませんでした。1行目に「名前」列があるExcelを選んでください。"; }
    e.target.value = "";
  });
  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const n = R.filter(p => p.on).length, w = parseInt($("inW").value, 10);
    if (!(n >= 2 && n <= 20)){ $("err").textContent = "対象者は2〜20人になるようチェックしてください。"; return; }
    if (!(w >= 0 && w <= n)){ $("err").textContent = `あたりの本数は0〜${n}本で入力してください。`; return; }
    $("err").textContent = "";
    S = derive({ w, hit: $("inHit").value.trim() || "あたり", miss: $("inMiss").value.trim() || "はずれ",
          roster: R.map(p => Object.assign({}, p)) });
    save(); build(); resize();
  });

  new ResizeObserver(resize).observe(cv);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  fillForm(); build(); resize();
})();
</script>

</body>
</html>
